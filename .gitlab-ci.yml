stages:
  - test
  - build

cache:
  paths:
    - backend/.m2/repository
    - frontend/.npm/

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=backend/.m2/repository"
  NODE_VERSION: "20"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"

backend_test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  before_script:
    - cd backend
  script:
    - |
      mvn clean test
      TEST_EXIT=$?
      mkdir -p target/surefire-reports target/site/jacoco
      echo "placeholder" > target/surefire-reports/.keep
      echo "placeholder" > target/site/jacoco/.keep
      exit $TEST_EXIT
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - backend/target/surefire-reports/
      - backend/target/site/jacoco/

frontend_test:
  stage: test
  image: cypress/included:latest
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm test -- --watch=false --code-coverage; TEST_EXIT=$?
    - mkdir -p coverage
    - echo "placeholder" > coverage/.keep
    - exit $TEST_EXIT
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/coverage/

backend_build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  needs: ["backend_test"]
  before_script:
    - cd backend
  script:
    - mvn clean package -DskipTests
  artifacts:
    expire_in: 14 days
    paths:
      - backend/target/*.jar

frontend_build:
  stage: build
  image: node:20
  needs: ["frontend_test"]
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    expire_in: 14 days
    paths:
      - frontend/dist/
